<title>Science Step · 배운 단원 문제</title>
<style>
:root{color-scheme:light;--bg:#edf1f8;--paper:#fff;--ink:#172033;--muted:#68758a;--line:#dce4ef;--blue:#526cff;--blue2:#7d8fff;--mint:#1ea67a;--green:#1f7b58;--red:#aa4050;--amber:#a86d16;--shadow:0 10px 28px rgba(48,62,91,.09)}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:linear-gradient(180deg,#f6f8fc 0,#edf1f8 38%,#edf1f8 100%);color:var(--ink);font-family:Pretendard,Inter,system-ui,-apple-system,"Noto Sans KR",sans-serif;letter-spacing:-.02em}.topbar{width:min(980px,calc(100% - 28px));margin:0 auto;padding:16px 0 12px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950}.topbar a{text-decoration:none;color:#58657a;font-size:13px;font-weight:850}.shell{width:min(900px,calc(100% - 28px));margin:0 auto;padding:12px 0 92px}.hero{background:#172033;color:#fff;border-radius:28px;padding:25px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(82,108,255,.24);right:-90px;top:-110px}.kicker{font-size:10px;font-weight:950;letter-spacing:.1em;color:#aebaff}.hero h1{font-size:clamp(28px,5vw,42px);line-height:1.08;margin:8px 0 9px;letter-spacing:-.05em}.hero p{margin:0;max-width:680px;color:#dce3f1;line-height:1.65;font-size:13px}.source-note{margin-top:14px;padding:11px 13px;border-radius:14px;background:rgba(255,255,255,.09);font-size:11px;line-height:1.55;color:#e5e9f2}.unit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.unit{background:#fff;border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:var(--shadow)}.unit.locked{opacity:.56}.unit-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{font-size:10px;font-weight:900;padding:5px 8px;border-radius:999px;background:#edf1ff;color:#526cff}.badge.done{background:#e3f7ef;color:#147459}.unit h3{margin:12px 0 5px;font-size:18px}.unit p{margin:0;color:var(--muted);font-size:11px;line-height:1.5}.unit a,.unit button{margin-top:13px;width:100%;border:0;border-radius:13px;padding:11px 12px;background:var(--blue);color:#fff;font:inherit;font-size:12px;font-weight:900;text-decoration:none;display:block;text-align:center;cursor:pointer}.unit.locked button{background:#dfe4ee;color:#7d8797;cursor:default}.set-head{display:flex;justify-content:space-between;gap:18px;align-items:end;margin:20px 0 14px}.set-head h2{margin:4px 0 6px;font-size:27px;letter-spacing:-.04em}.set-head p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}.set-meta{text-align:right;font-size:11px;color:var(--muted)}.set-meta b{display:block;font-size:18px;color:var(--ink)}.progress{margin:12px 0 16px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:12px;font-weight:850;color:#59667a}.qcard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0;box-shadow:var(--shadow)}.qtop{display:flex;align-items:center;gap:9px;margin-bottom:10px;font-size:11px;color:#637086}.qtop span{width:27px;height:27px;border-radius:9px;background:#edf1ff;color:var(--blue);display:grid;place-items:center;font-weight:950}.prompt{font-size:16px;line-height:1.62;font-weight:850;margin:8px 0 12px}.choices{display:grid;gap:8px}.choice{border:1px solid #dfe5ee;border-radius:13px;background:#f9fbfd;padding:12px 13px;text-align:left;font:inherit;font-weight:720;cursor:pointer}.choice.selected{border-color:#8397ef;background:#f0f3ff;color:#3153bd}.choice.correct{border-color:#a9d7bd;background:#edf9f2;color:#286345}.choice.wrong{border-color:#e6a8b3;background:#fff0f3;color:#8c3847}.answer{display:none;margin-top:10px;border-radius:12px;padding:11px 12px;font-size:12px;line-height:1.55}.answer.show.good{display:block;background:#edf9f2;color:#2c674a}.answer.show.bad{display:block;background:#fff0f3;color:#8c3847}.rem-wrap{margin:28px 0 0;padding-top:18px;border-top:1px solid #d8e0eb}.rem-wrap h3{font-size:21px;margin:0 0 5px}.rem-wrap>p{margin:0 0 12px;color:var(--muted);font-size:12px}.remediation{border-color:#ecdcae;background:#fffdf8}.actions{position:sticky;bottom:10px;z-index:5;margin-top:15px;display:flex;justify-content:center}.primary{border:0;border-radius:14px;padding:13px 18px;width:min(440px,100%);background:var(--blue);color:#fff;font:inherit;font-weight:950;box-shadow:0 10px 24px rgba(82,108,255,.25);cursor:pointer}.primary:disabled{opacity:.48;cursor:default}.done{margin:24px 0;background:#eaf8f1;border:1px solid #b9dec9;border-radius:18px;padding:18px;color:#275f44}.done h3{margin:0 0 5px}.done p{margin:0;font-size:12px;line-height:1.55}.done-actions{display:flex;gap:9px;margin-top:13px}.done-actions a{flex:1;text-align:center;text-decoration:none;border-radius:12px;padding:11px;font-weight:900;font-size:12px;background:#fff;color:#35506c}.done-actions a.primary-link{background:var(--blue);color:#fff}.notice{margin:30px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;max-width:650px}.visual{margin:12px 0!important}.visual-hq{box-shadow:none!important}.back-list{display:inline-block;margin:12px 0;text-decoration:none;color:#59677a;font-size:12px;font-weight:850}
