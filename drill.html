<title>Science Step · 오늘 문제</title>
<style>
:root{color-scheme:light;--bg:#f3f4f6;--paper:#fff;--ink:#171b24;--muted:#687180;--line:#dde2e9;--blue:#315ee8;--green:#1d7b50;--red:#a43c4b;--shadow:0 5px 20px rgba(24,35,58,.06)}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,Inter,system-ui,-apple-system,"Noto Sans KR",sans-serif;letter-spacing:-.02em}.topbar{width:min(920px,calc(100% - 28px));margin:0 auto;padding:16px 0 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.topbar a{text-decoration:none;color:#4d5868;font-weight:800;font-size:13px}.brand{font-weight:900}.drill-shell{width:min(820px,calc(100% - 28px));margin:0 auto;padding:24px 0 100px}.set-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin:4px 0 18px}.kicker{font-size:11px;font-weight:900;letter-spacing:.05em;color:#657184}.set-head h1,.remed-head h2{margin:5px 0 8px;letter-spacing:-.04em}.set-head h1{font-size:30px}.set-head p,.remed-head p{margin:0;color:var(--muted);line-height:1.6;font-size:13px}.set-meta{min-width:132px;text-align:right;display:grid;gap:4px}.set-meta b{font-size:18px}.set-meta span{font-size:11px;color:var(--muted)}.progress-note{margin:14px 0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#535e6f;font-size:12px;font-weight:800}.qcard{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px;margin:12px 0}.qtop{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:#5d6878;font-size:12px}.qtop span{display:grid;place-items:center;width:25px;height:25px;border-radius:7px;background:#eef2ff;color:var(--blue);font-weight:900}.prompt{font-size:16px;line-height:1.65;font-weight:760;margin-bottom:12px}.choices{display:grid;gap:8px}.choice{border:1px solid #dfe4eb;border-radius:10px;background:#fafbfc;padding:11px 12px;text-align:left;font:inherit;font-weight:680;cursor:pointer}.choice:hover{border-color:#b7c4e7}.choice.selected{border-color:#7891ed;background:#f0f3ff;color:#274ebf}.choice.correct{border-color:#9dd1b5;background:#edf9f2;color:#226443}.choice.wrong{border-color:#e8a8b1;background:#fff0f2;color:#913846}.choice:disabled{cursor:default}.answer{display:none;margin-top:10px;padding:11px 12px;border-radius:9px;font-size:13px;line-height:1.6}.answer.correct,.answer.wrong{display:block}.answer.correct{background:#edf9f2;color:#2b6849}.answer.wrong{background:#fff0f2;color:#873743}.answer span{opacity:.82}.remed-wrap{margin-top:28px;padding-top:22px;border-top:1px solid #d9dee6}.remediation{border-color:#e5d8b8}.done{margin:30px 0;padding:20px;border:1px solid #b9dcc8;border-radius:14px;background:#eef9f2;color:#275d40}.done b{font-size:18px}.done p{margin:6px 0 0;line-height:1.55}.sticky-action{position:sticky;bottom:12px;z-index:5;margin:18px auto;display:flex;justify-content:center}.primary{width:min(420px,100%);border:0;border-radius:12px;background:var(--blue);color:#fff;padding:14px 18px;font:inherit;font-weight:900;box-shadow:0 8px 22px rgba(49,94,232,.22);cursor:pointer}.primary:disabled{opacity:.5;cursor:default}.notice{width:min(700px,calc(100% - 28px));margin:40px auto;padding:18px;background:#fff;border:1px solid var(--line);border-radius:14px}.visual{margin:12px 0!important;min-height:0!important;box-shadow:none!important}.rem-feedback{display:none}
@media(max-width:620px){.topbar,.drill-shell{width:min(100% - 20px,920px)}.set-head{display:block}.set-meta{text-align:left;margin-top:10px}.set-head h1{font-size:25px}.qcard{padding:14px;border-radius:13px}.prompt{font-size:15px}.choice{padding:11px}.sticky-action{bottom:8px}}
@media(max-height:430px) and (orientation:landscape){.drill-shell{padding-top:14px}.set-head h1{font-size:23px}.set-head p{display:none}.qcard{padding:13px}.sticky-action{position:static}}
</style>
