name: Visual Audit

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "learning-data.js"
      - "learning-app.js"
      - "quiz-data.js"
      - "tests/visual-audit.mjs"
      - "QA_RULES.md"
      - ".github/workflows/visual-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html learning-data.js learning-app.js quiz-data.js _site/
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium
      - name: Serve site
        run: |
          python3 -m http.server 4173 -d _site > /tmp/science-http.log 2>&1 &
          echo $! > /tmp/science-http.pid
          sleep 2
      - name: Run guided learning audit
        run: node tests/visual-audit.mjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-audit
          path: audit-artifacts/
          if-no-files-found: error
