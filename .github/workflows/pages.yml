name: Deploy Daily Science Drill

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "learning-data.js"
      - "learning-app.js"
      - "quiz-data.js"
      - "quiz-data-2026-09-04.js"
      - "quiz-data-daily.js"
      - "tests/visual-audit.mjs"
      - "QA_RULES.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare test site
        run: |
          mkdir -p _site
          cp index.html learning-data.js learning-app.js quiz-data.js quiz-data-2026-09-04.js quiz-data-daily.js _site/
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium
      - name: Serve test site
        run: |
          python3 -m http.server 4173 -d _site > /tmp/science-http.log 2>&1 &
          sleep 2
      - name: Run guided learning QA
        run: node tests/visual-audit.mjs
      - name: Keep QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-qa
          path: audit-artifacts/
          if-no-files-found: error

  deploy:
    needs: quality_gate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build static artifact
        run: |
          mkdir -p _site
          cp index.html learning-data.js learning-app.js quiz-data.js quiz-data-2026-09-04.js quiz-data-daily.js _site/
          sed -i "s|src=\"learning-data.js\"|src=\"learning-data.js?v=${GITHUB_SHA}\"|" _site/index.html
          sed -i "s|src=\"learning-app.js\"|src=\"learning-app.js?v=${GITHUB_SHA}\"|" _site/index.html
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
