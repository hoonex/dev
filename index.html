<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#050506" />
  <meta name="color-scheme" content="dark" />
  <title>ONE — 오늘, 한 단어</title>
  <meta name="description" content="하루 한 질문. 답은 한 단어. 모두의 답이 하나의 공간이 됩니다." />
  <link rel="stylesheet" href="./styles.css" />
  <script src="./config.js" defer></script>
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>
  <div id="grain" aria-hidden="true"></div>

  <main class="shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="ONE 홈">ONE<span class="dot">.</span></a>
      <div class="live" id="liveStatus"><span></span><b id="onlineCount">—</b> here</div>
    </header>

    <section class="question-wrap" id="questionWrap">
      <p class="date" id="dateLabel">TODAY</p>
      <h1 id="question">오늘, 가장 놓치고 싶지 않은 것은?</h1>
      <p class="rule">한 사람 · 한 단어 · 하루 한 번</p>
    </section>

    <section class="composer" id="composer">
      <form id="answerForm" autocomplete="off">
        <label class="sr-only" for="answerInput">한 단어로 답하기</label>
        <input id="answerInput" maxlength="16" inputmode="text" placeholder="한 단어를 남겨보세요" />
        <button type="submit" aria-label="답 보내기">↗</button>
      </form>
      <p id="composerHint">공백 없이 최대 16자</p>
    </section>

    <section class="after" id="afterPanel" hidden>
      <button class="my-word" id="myWordButton"><span>내 답</span><b id="myWord">—</b></button>
      <button class="share" id="shareButton">오늘의 ONE 공유</button>
    </section>

    <aside class="word-info" id="wordInfo" hidden>
      <button class="word-info-close" id="wordInfoClose" aria-label="닫기">×</button>
      <p id="wordInfoLabel">같은 답</p>
      <strong id="wordInfoWord">—</strong>
      <span id="wordInfoCount">0명</span>
    </aside>

    <footer>
      <button id="aboutButton">ABOUT</button>
      <span id="totalCount">0 answers today</span>
    </footer>
  </main>

  <dialog id="aboutDialog">
    <button class="dialog-close" id="aboutClose" aria-label="닫기">×</button>
    <p class="dialog-kicker">ONE / 24H</p>
    <h2>하루가 바뀌면<br>질문도, 공간도 바뀝니다.</h2>
    <p>이곳엔 프로필도, 팔로워도, 댓글도 없습니다. 오늘의 질문에 한 단어만 남기면 됩니다. 같은 답은 서로 끌려 더 크게 보이고, 새 답은 잠깐 떠올랐다 사라집니다.</p>
    <p>화면을 터치해 보세요. 당신의 파동은 지금 접속한 다른 사람에게도 보입니다.</p>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
