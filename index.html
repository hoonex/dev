<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f8fafc" />
  <title>Daily Science Drill</title>
  <style>
    :root{color-scheme:light;--bg:#f5f8ff;--paper:#fff;--line:#dce4f2;--text:#172033;--muted:#6c7890;--accent:#315ee8;--good:#167346;--goodbg:#eaf8f0;--bad:#b83246;--badbg:#fff0f2;--warn:#9a650f;--warnbg:#fff7e6;--test:#7357d9;--testbg:#f1edff;--shadow:0 18px 55px rgba(31,48,78,.10)}
    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% -8%,#dfe9ff 0,transparent 31%),radial-gradient(circle at 94% 5%,#e9f7ff 0,transparent 26%),var(--bg);color:var(--text);font-family:Inter,Pretendard,system-ui,-apple-system,"Noto Sans KR",sans-serif}button,input,select{font:inherit}
    .shell{width:min(860px,calc(100% - 28px));margin:0 auto;padding:22px 0 82px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}.brand{display:flex;align-items:center;gap:10px;font-weight:850;letter-spacing:-.035em}.mark{width:35px;height:35px;border-radius:11px;background:linear-gradient(145deg,#315ee8,#7895ff);box-shadow:0 8px 20px #315ee82c;display:grid;place-items:center;color:#fff;font-size:13px}.account{border:1px solid var(--line);background:#ffffffd9;color:var(--text);border-radius:999px;padding:9px 13px;font-weight:730;cursor:pointer}.hero{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:18px}.eyebrow{font-size:11px;font-weight:850;letter-spacing:.13em;color:#7181a3;text-transform:uppercase}.hero h1{font-size:clamp(34px,8vw,58px);line-height:.97;letter-spacing:-.058em;margin:7px 0 0}.status{font-size:13px;color:var(--muted);text-align:right;line-height:1.55}
    .panel{background:rgba(255,255,255,.94);border:1px solid rgba(215,223,236,.95);border-radius:24px;padding:20px;box-shadow:var(--shadow);backdrop-filter:blur(14px)}.banner{padding:14px 15px;border-radius:16px;margin-bottom:16px;border:1px solid #cfc3ff;background:var(--testbg);color:#5743a8;line-height:1.55;font-size:13px}.banner b{font-size:14px}.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.pill{border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:var(--muted);background:#fff;font-size:12px;font-weight:700}.pill.test{border-color:#cabfff;background:var(--testbg);color:var(--test)}.pill.overdue{border-color:#ffc7cf;color:var(--bad);background:var(--badbg)}.notice{margin:0 0 16px;padding:13px 14px;border-radius:15px;border:1px solid #ffd2d8;background:var(--badbg);color:#98293a;font-size:13px;line-height:1.55}.title{font-size:22px;font-weight:860;letter-spacing:-.035em}.small{font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.55}.progress{height:8px;background:#edf1f7;border-radius:99px;overflow:hidden;margin:17px 0 12px}.bar{height:100%;width:0;background:linear-gradient(90deg,#315ee8,#7b96fa);transition:.25s}.q{padding:23px 0;border-top:1px solid #e8edf4}.q:first-of-type{border-top:0}.qnum{font-size:11px;color:#8190a9;font-weight:850;letter-spacing:.08em;margin-bottom:9px}.prompt{font-size:17px;line-height:1.58;font-weight:770;letter-spacing:-.025em}.choices{display:grid;gap:9px;margin-top:14px}.choice{width:100%;border:1px solid #dce4ef;background:#fff;color:var(--text);border-radius:15px;padding:13px 14px;text-align:left;cursor:pointer;transition:.14s}.choice:hover{border-color:#9bb0e9;background:#fbfcff}.choice.selected{border-color:#6d8cf1;background:#eef3ff;box-shadow:0 0 0 2px #dfe8ff inset}.choice.correct{border-color:#88cea7;background:var(--goodbg);color:#125b39}.choice.wrong{border-color:#ee9daa;background:var(--badbg);color:#8d2635}.choice:disabled{cursor:default}.answer{display:none;margin-top:12px;padding:13px 14px;border-radius:14px;background:#f7f9fc;border:1px solid #e1e7f0;color:#4f5b6f;line-height:1.57;font-size:13.5px}.answer.show{display:block}.actions{position:sticky;bottom:10px;display:flex;gap:10px;margin-top:18px;padding-top:4px}.btn{flex:1;border:0;border-radius:15px;padding:14px 16px;font-weight:830;cursor:pointer;box-shadow:0 8px 20px #1f2c4310}.primary{background:var(--accent);color:#fff}.secondary{background:#fff;color:#33405a;border:1px solid var(--line)}.score{display:none;margin-top:17px;border-radius:17px;padding:16px;background:#f8faff;border:1px solid #dce4f2;line-height:1.6}.score.show{display:block}.history{margin-top:20px}.history select{width:100%;background:#fff;color:var(--text);border:1px solid var(--line);border-radius:13px;padding:12px}.history option:disabled{color:#aaa}.empty{color:var(--muted);line-height:1.7;padding:30px 6px}
    .visual{margin:14px 0 4px;padding:15px;border-radius:18px;background:linear-gradient(180deg,#fafdff,#f4f8ff);border:1px solid #dce6f4;overflow:auto}.visual svg{width:100%;height:auto;display:block;min-height:180px}.visual table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}.visual th,.visual td{border:1px solid #dce4ef;padding:10px;text-align:center;font-size:13px}.visual th{background:#f1f5fb;font-weight:800}.visual-caption{font-size:11.5px;color:var(--muted);margin-top:8px;text-align:center}
    .remed{margin-top:20px;border-radius:20px;background:#fffaf0;border:1px solid #f0d7a4;padding:17px}.remed-head{display:flex;align-items:start;justify-content:space-between;gap:12px}.remed-title{font-size:19px;font-weight:850;letter-spacing:-.03em}.remed-badge{font-size:11px;font-weight:850;padding:6px 9px;border-radius:999px;background:#fff0ca;color:#8b5d0a}.rq{padding:18px 0;border-top:1px solid #f1dfba}.rq:first-of-type{border-top:0}.ranswer{display:none;margin-top:10px;padding:11px 12px;border-radius:12px;background:#fff;border:1px solid #eddab7;font-size:13px;color:#5f594d;line-height:1.5}.ranswer.show{display:block}.remed-actions{display:flex;gap:9px;margin-top:10px}.complete{margin-top:17px;border:1px solid #b8dfc9;background:var(--goodbg);color:#145b39;border-radius:16px;padding:14px;font-size:14px;line-height:1.55}
    dialog{border:0;padding:0;border-radius:22px;box-shadow:0 28px 90px #24345233;width:min(430px,calc(100% - 28px));color:var(--text)}dialog::backdrop{background:#33405a38;backdrop-filter:blur(5px)}.authbox{padding:22px}.authhead{display:flex;align-items:center;justify-content:space-between;gap:12px}.authhead h2{margin:0;font-size:23px;letter-spacing:-.04em}.close{border:0;background:#f1f4f9;width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:18px}.field{display:grid;gap:6px;margin-top:14px}.field label{font-size:12px;font-weight:760;color:var(--muted)}.field input{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px 13px;outline:none;background:#fff}.field input:focus{border-color:#7791e7;box-shadow:0 0 0 3px #e4ebff}.authactions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.authmsg{min-height:20px;margin-top:10px;font-size:12.5px;color:var(--muted);line-height:1.5}.signed{padding:16px 0 4px}.signed strong{font-size:20px}.sync{font-size:12px;color:var(--muted);margin-top:5px}.logout{width:100%;margin-top:17px;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px;cursor:pointer;font-weight:760}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);background:#1e2a42;color:#fff;border-radius:999px;padding:10px 14px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:560px){.shell{padding-top:17px}.hero{align-items:start;flex-direction:column}.status{text-align:left}.panel{border-radius:20px;padding:16px}.actions{bottom:8px}.authactions{grid-template-columns:1fr}.top{margin-bottom:20px}.visual{padding:9px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="top"><div class="brand"><span class="mark">SD</span><span>Science Drill</span></div><button class="account" id="accountBtn">로그인</button></div>
    <section class="hero"><div><div class="eyebrow">2026 MIDTERM · PHYSICS / CHEMISTRY</div><h1>Daily<br>Science Drill</h1></div><div class="status" id="stat">문제를 불러오는 중…</div></section>
    <section class="panel"><div id="app" class="empty">문제 데이터를 확인하고 있어.</div></section>
  </main>
  <dialog id="authDialog"><div class="authbox"><div class="authhead"><h2>학습 계정</h2><button class="close" id="authClose" aria-label="닫기">×</button></div><div id="authBody"></div></div></dialog>
  <div class="toast" id="toast"></div>
  <script src="quiz-data.js"></script>
  <script>
  const API_URL='https://eicwcohfrvhwimwevzkd.supabase.co';
  const API_KEY='sb_publishable_-9Cf0yVjLWf88pcvAqQ-EQ_YN9v3Obz';
  const sets=Array.isArray(window.QUIZ_SETS)?window.QUIZ_SETS:[];
  const app=document.getElementById('app'),stat=document.getElementById('stat'),accountBtn=document.getElementById('accountBtn');
  const authDialog=document.getElementById('authDialog'),authBody=document.getElementById('authBody'),toastEl=document.getElementById('toast');
  const key=s=>`science-drill:${s.id||s.date}`;
  const sessionKey='science-drill-session-v1';
  const authSession=()=>{try{return JSON.parse(localStorage.getItem(sessionKey)||'null')}catch{return null}};
  const savedFor=s=>{try{return JSON.parse(localStorage.getItem(key(s))||'null')}catch{return null}};
  const completed=s=>{const x=savedFor(s);return Boolean(x?.graded&&x?.remediationDone!==false)};
  const deadlineMs=s=>s.test||s.required===false?Infinity:(s.deadline?new Date(s.deadline).getTime():new Date(`${s.date}T23:59:59+09:00`).getTime()+86400000);
  const isOverdue=s=>Number.isFinite(deadlineMs(s))&&Date.now()>deadlineMs(s)&&!completed(s);
  const firstOverdueIndex=()=>sets.findIndex(s=>!s.test&&isOverdue(s));
  const overdueCount=()=>sets.filter(s=>!s.test&&isOverdue(s)).length;
  const deadlineLabel=s=>!Number.isFinite(deadlineMs(s))?'진도 미반영':new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(deadlineMs(s)));
  let setIndex=firstOverdueIndex()>=0?firstOverdueIndex():Math.max(0,sets.length-1),selected={},remSelected={};
  function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastEl._t);toastEl._t=setTimeout(()=>toastEl.classList.remove('show'),1900)}
  async function rpc(name,body){const r=await fetch(`${API_URL}/rest/v1/rpc/${name}`,{method:'POST',headers:{apikey:API_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const text=await r.text();let data;try{data=JSON.parse(text)}catch{data=text}if(!r.ok)throw new Error(data?.message||String(data||'요청 실패'));return data}
  async function syncSave(s,data){if(s.test||s.sync===false)return;const session=authSession();if(!session?.token)return;try{await rpc('science_drill_progress_save',{p_token:session.token,p_quiz_date:s.date,p_data:data})}catch(e){console.warn('sync save',e)}}
  function persist(s,data){localStorage.setItem(key(s),JSON.stringify(data));syncSave(s,data)}
  function render(){
    updateAccount();if(!sets.length){app.innerHTML='<div class="empty"><b>아직 생성된 문제가 없어.</b><br>평일 자정 학습 뒤 문제 세트가 자동으로 추가돼.</div>';stat.textContent='대기 중';return}
    const debt=firstOverdueIndex();if(debt>=0&&setIndex>debt&&!sets[setIndex]?.test)setIndex=debt;
    const s=sets[setIndex],saved=savedFor(s);selected=saved?.answers||{};remSelected=saved?.remediationAnswers||{};const overdue=isOverdue(s),done=completed(s);
    stat.textContent=s.test?'오늘은 시스템 테스트 · 내일부터 정식':debt>=0?`연체 ${overdueCount()}회 · 먼저 완료`:`누적 ${sets.filter(x=>!x.test).length}회 · ${done?'세트 완료':s.subject}`;
    app.className='';app.innerHTML=`${s.test?'<div class="banner"><b>오늘 세트는 테스트용.</b><br>난이도·그림·오답보강·로그인 기능을 확인하는 미리보기이며 진도에는 반영하지 않는다. <b>내일(9/2)부터 완자 진도에 맞춘 정식 문제가 나온다.</b></div>':''}${overdue?'<div class="notice"><b>마감이 지난 세트야.</b><br>본문 문제와 오답 보강까지 끝내야 다음 정식 세트가 열린다.</div>':''}
      <div class="meta"><span class="pill ${s.test?'test':''}">${s.test?'TEST':'정식'}</span><span class="pill">${esc(s.subject)}</span><span class="pill">${esc(s.range||'학습 범위')}</span><span class="pill">${s.questions.length}문제</span><span class="pill ${overdue?'overdue':''}">${s.test?'진도 미반영':'마감 '+esc(deadlineLabel(s))}</span></div>
      <div class="title">${esc(s.title||'오늘의 확인 문제')}</div><div class="small">${esc(s.note||'본문 채점 후 틀린 문제는 같은 개념의 변형문제로 다시 확인한다.')}</div>
      <div class="progress"><div class="bar" id="bar"></div></div><div id="questions">${s.questions.map((q,i)=>questionHtml(q,i)).join('')}</div><div id="score" class="score"></div><div id="remediation"></div>${done?'<div class="complete"><b>완료.</b> 본문과 필요한 오답 보강까지 끝났다.</div>':''}
      <div class="history"><select id="history">${sets.map((x,i)=>`<option value="${i}" ${i===setIndex?'selected':''} ${debt>=0&&!x.test&&i>debt?'disabled':''}>${x.test?'[TEST] ':''}${esc(x.subject)} · ${esc(x.title||'문제 세트')}${completed(x)?' · 완료':isOverdue(x)?' · 연체':''}</option>`).reverse().join('')}</select></div><div class="actions"><button class="btn secondary" id="reset">다시 풀기</button><button class="btn primary" id="submit">${saved?.graded?'채점 결과 보기':'본문 채점하기'}</button></div>`;
    document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(+b.dataset.q,+b.dataset.c));document.getElementById('reset').onclick=()=>{localStorage.removeItem(key(s));syncSave(s,{});render()};document.getElementById('submit').onclick=()=>gradeMain(Boolean(saved?.graded));document.getElementById('history').onchange=e=>{const target=Number(e.target.value),d=firstOverdueIndex();setIndex=d>=0&&!sets[target].test&&target>d?d:target;render()};Object.entries(selected).forEach(([qi,ci])=>markSelected(+qi,+ci));updateBar();if(saved?.graded)gradeMain(true);
  }
  function questionHtml(q,i){return `<article class="q" id="q${i}"><div class="qnum">QUESTION ${String(i+1).padStart(2,'0')} · ${esc(q.type||'개념/적용')}</div><div class="prompt">${esc(q.prompt)}</div>${visualHtml(q.visual)}<div class="choices">${q.choices.map((c,j)=>`<button class="choice" data-q="${i}" data-c="${j}">${j+1}. ${esc(c)}</button>`).join('')}</div><div class="answer" id="a${i}"></div></article>`}
  function visualHtml(v){if(!v)return'';if(v.type==='table'){return `<div class="visual"><table><thead><tr>${v.headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${v.rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>${v.caption?`<div class="visual-caption">${esc(v.caption)}</div>`:''}</div>`}if(v.type==='piston'){const states=v.states||[];const cards=states.map((s,idx)=>{const x=20+idx*180,h=115*(s.height||.6),y=150-h;let dots='';for(let k=0;k<(s.particles||8);k++){const cx=x+28+(k%4)*28,cy=y+22+Math.floor(k/4)*25;dots+=`<circle cx="${cx}" cy="${cy}" r="5" fill="#6b86e8"/>`}return `<g><text x="${x+70}" y="20" text-anchor="middle" font-size="13" font-weight="700">${esc(s.label||'상태')}</text><rect x="${x}" y="35" width="140" height="115" rx="8" fill="#fff" stroke="#8ea1c4"/><rect x="${x+7}" y="${y}" width="126" height="6" rx="3" fill="#33405a"/>${dots}<text x="${x+70}" y="170" text-anchor="middle" font-size="12">${esc(s.pressure||'')}</text></g>`}).join('');return `<div class="visual"><svg viewBox="0 0 ${Math.max(360,states.length*180)} 190" role="img">${cards}</svg>${v.caption?`<div class="visual-caption">${esc(v.caption)}</div>`:''}</div>`}if(v.type==='graph'){const pts=v.points||[],xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys),mapX=x=>55+(x-xmin)/(xmax-xmin||1)*300,mapY=y=>155-(y-ymin)/(ymax-ymin||1)*115,poly=pts.map(p=>`${mapX(p[0])},${mapY(p[1])}`).join(' ');return `<div class="visual"><svg viewBox="0 0 390 190" role="img"><line x1="55" y1="155" x2="365" y2="155" stroke="#53627a"/><line x1="55" y1="155" x2="55" y2="28" stroke="#53627a"/><polyline points="${poly}" fill="none" stroke="#315ee8" stroke-width="3"/>${pts.map(p=>`<circle cx="${mapX(p[0])}" cy="${mapY(p[1])}" r="5" fill="#315ee8"/>`).join('')}<text x="360" y="178" text-anchor="end" font-size="12">${esc(v.xLabel||'x')}</text><text x="20" y="34" font-size="12">${esc(v.yLabel||'y')}</text></svg>${v.caption?`<div class="visual-caption">${esc(v.caption)}</div>`:''}</div>`}if(v.type==='vectors'){const ox=190,oy=105,arr=(v.vectors||[]).map(a=>`<line x1="${ox}" y1="${oy}" x2="${ox+a.x}" y2="${oy-a.y}" stroke="#315ee8" stroke-width="4" marker-end="url(#arr)"/><text x="${ox+a.x+6}" y="${oy-a.y-5}" font-size="12" font-weight="700">${esc(a.label||'')}</text>`).join(''),r=v.resultant?`<line x1="${ox}" y1="${oy}" x2="${ox+v.resultant.x}" y2="${oy-v.resultant.y}" stroke="#d04d63" stroke-width="4" stroke-dasharray="6 5" marker-end="url(#arr2)"/><text x="${ox+v.resultant.x+6}" y="${oy-v.resultant.y-5}" font-size="12" fill="#a52f42" font-weight="700">${esc(v.resultant.label||'R')}</text>`:'';return `<div class="visual"><svg viewBox="0 0 390 210" role="img"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#315ee8"/></marker><marker id="arr2" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#d04d63"/></marker></defs><circle cx="${ox}" cy="${oy}" r="4" fill="#172033"/>${arr}${r}</svg>${v.caption?`<div class="visual-caption">${esc(v.caption)}</div>`:''}</div>`}if(v.type==='trajectory'){const pts=v.points||[[0,0],[1,1.7],[2,2.5],[3,2.4],[4,1.5],[5,0]],mapX=x=>35+x*62,mapY=y=>160-y*45,poly=pts.map(p=>`${mapX(p[0])},${mapY(p[1])}`).join(' ');return `<div class="visual"><svg viewBox="0 0 390 190" role="img"><line x1="25" y1="160" x2="370" y2="160" stroke="#65738c"/><polyline points="${poly}" fill="none" stroke="#315ee8" stroke-width="3"/>${pts.map((p,i)=>`<circle cx="${mapX(p[0])}" cy="${mapY(p[1])}" r="5" fill="${i===v.highlight?'#d04d63':'#315ee8'}"/>`).join('')}</svg>${v.caption?`<div class="visual-caption">${esc(v.caption)}</div>`:''}</div>`}return''}
  function markSelected(qi,ci){document.querySelectorAll(`[data-q="${qi}"]`).forEach(b=>b.classList.toggle('selected',+b.dataset.c===ci))}function choose(qi,ci){if(savedFor(sets[setIndex])?.graded)return;selected[qi]=ci;markSelected(qi,ci);updateBar()}function updateBar(){const s=sets[setIndex],n=Object.keys(selected).length,b=document.getElementById('bar');if(b)b.style.width=`${100*n/s.questions.length}%`}
  function gradeMain(fromSaved=false){const s=sets[setIndex];let score=0;const wrong=[];s.questions.forEach((q,i)=>{document.querySelectorAll(`[data-q="${i}"]`).forEach(b=>{b.disabled=true;const c=+b.dataset.c;b.classList.remove('selected');if(c===q.answer)b.classList.add('correct');else if(selected[i]===c)b.classList.add('wrong')});const ok=selected[i]===q.answer;if(ok)score++;else wrong.push(i);const a=document.getElementById(`a${i}`);a.innerHTML=`<b>${ok?'정답':'오답'} · ${q.answer+1}번</b><br>${esc(q.explanation||'')}${q.tip?`<br><span style="color:#71809a">TIP · ${esc(q.tip)}</span>`:''}`;a.classList.add('show')});const pct=Math.round(score/s.questions.length*100),box=document.getElementById('score');box.innerHTML=`<b>${score} / ${s.questions.length} · ${pct}점</b><br><span style="color:var(--muted)">${wrong.length?`틀린 ${wrong.length}개 개념은 아래 보강문제로 다시 확인한다.`:'전부 맞음.'}${s.test?' · 오늘 점수는 진도에 반영되지 않는다.':''}</span>`;box.classList.add('show');let saved=savedFor(s)||{};if(!fromSaved){saved={...saved,answers:selected,graded:true,score,wrongIndices:wrong,remediationDone:wrong.length===0,at:Date.now()};persist(s,saved)}const actual=savedFor(s)||saved;if(actual.wrongIndices?.length&&!actual.remediationDone)renderRemediation(actual.wrongIndices,actual);if(!fromSaved)box.scrollIntoView({behavior:'smooth',block:'center'})}
  function remediationItems(s,wrong){const out=[];wrong.forEach(qi=>(s.questions[qi].remediation||[]).forEach((r,ri)=>out.push({...r,qi,ri,id:`${qi}:${ri}`})));return out}function renderRemediation(wrong,saved){const s=sets[setIndex],items=remediationItems(s,wrong),host=document.getElementById('remediation');if(!items.length){saved.remediationDone=true;persist(s,saved);return}remSelected=saved.remediationAnswers||{};host.innerHTML=`<section class="remed"><div class="remed-head"><div><div class="remed-title">오답 보강</div><div class="small">같은 개념을 다른 상황으로 다시 확인한다.</div></div><span class="remed-badge">${items.length}문제</span></div>${items.map((r,i)=>`<article class="rq"><div class="qnum">RETRY ${String(i+1).padStart(2,'0')} · 본문 ${r.qi+1}번</div><div class="prompt">${esc(r.prompt)}</div>${visualHtml(r.visual)}<div class="choices">${r.choices.map((c,j)=>`<button class="choice rchoice" data-r="${r.id}" data-c="${j}">${j+1}. ${esc(c)}</button>`).join('')}</div><div class="ranswer" id="ra-${r.qi}-${r.ri}"></div></article>`).join('')}<div id="remResult"></div><div class="remed-actions"><button class="btn primary" id="remSubmit">보강 채점하기</button></div></section>`;document.querySelectorAll('.rchoice').forEach(b=>b.onclick=()=>{remSelected[b.dataset.r]=+b.dataset.c;document.querySelectorAll(`[data-r="${b.dataset.r}"]`).forEach(x=>x.classList.toggle('selected',x===b))});Object.entries(remSelected).forEach(([id,ci])=>document.querySelectorAll(`[data-r="${id}"]`).forEach(b=>b.classList.toggle('selected',+b.dataset.c===+ci)));document.getElementById('remSubmit').onclick=()=>gradeRemediation(items)}
  function gradeRemediation(items){const s=sets[setIndex],saved=savedFor(s)||{};let correct=0;items.forEach(r=>{const picked=remSelected[r.id],ok=picked===r.answer;if(ok)correct++;document.querySelectorAll(`[data-r="${r.id}"]`).forEach(b=>{b.disabled=true;const c=+b.dataset.c;b.classList.remove('selected');if(c===r.answer)b.classList.add('correct');else if(picked===c)b.classList.add('wrong')});const a=document.getElementById(`ra-${r.qi}-${r.ri}`);a.innerHTML=`<b>${ok?'정답':'오답'} · ${r.answer+1}번</b><br>${esc(r.explanation||'')}${r.tip?`<br><span style="color:#88734d">TIP · ${esc(r.tip)}</span>`:''}`;a.classList.add('show')});const all=correct===items.length,next={...saved,remediationAnswers:remSelected,remediationDone:all,at:Date.now()};persist(s,next);const result=document.getElementById('remResult');result.className=all?'complete':'notice';result.innerHTML=all?`<b>보강 완료 · ${correct}/${items.length}</b><br>변형문제까지 통과했다.`:`<b>보강 ${correct}/${items.length}</b><br>해설을 확인하고 다시 풀어야 완료된다.`;const btn=document.getElementById('remSubmit');if(all){btn.textContent='완료됨';btn.disabled=true;setTimeout(render,500)}else{btn.textContent='보강 다시 풀기';btn.onclick=()=>{next.remediationAnswers={};persist(s,next);render()}}}
  function updateAccount(){const s=authSession();accountBtn.textContent=s?.username?`${s.username} · 동기화`:'로그인'}accountBtn.onclick=()=>openAuth();document.getElementById('authClose').onclick=()=>authDialog.close();function openAuth(){const s=authSession();if(s?.token){authBody.innerHTML=`<div class="signed"><strong>${esc(s.username)}</strong><div class="sync">정식 문제 완료 기록이 기기 간 동기화된다. 테스트 세트는 동기화하지 않는다.</div><button class="logout" id="syncNow">지금 동기화</button><button class="logout" id="logout">로그아웃</button></div>`;document.getElementById('syncNow').onclick=()=>syncProgress(true);document.getElementById('logout').onclick=logout}else{authBody.innerHTML=`<div class="small">이메일 없이 아이디와 비밀번호만 사용한다. 아이디 3~24자, 비밀번호 6자 이상.</div><div class="field"><label>아이디</label><input id="username" autocomplete="username" placeholder="예: science01"></div><div class="field"><label>비밀번호</label><input id="password" type="password" autocomplete="current-password" placeholder="6자 이상"></div><div class="authactions"><button class="btn secondary" id="signup">계정 만들기</button><button class="btn primary" id="login">로그인</button></div><div class="authmsg" id="authMsg"></div>`;document.getElementById('login').onclick=()=>authAction('login');document.getElementById('signup').onclick=()=>authAction('signup')}authDialog.showModal()}
  async function authAction(mode){const u=document.getElementById('username').value.trim().toLowerCase(),p=document.getElementById('password').value,msg=document.getElementById('authMsg');msg.textContent='처리 중…';try{const data=await rpc(mode==='login'?'science_drill_login':'science_drill_signup',{p_username:u,p_password:p});localStorage.setItem(sessionKey,JSON.stringify(data));msg.textContent='성공. 진도를 동기화하는 중…';await syncProgress(false);authDialog.close();toast(mode==='login'?'로그인됨':'계정 생성됨');render()}catch(e){const m=e.message||'';msg.textContent=m.includes('USERNAME_TAKEN')?'이미 사용 중인 아이디야.':m.includes('USERNAME_FORMAT')?'아이디 형식을 확인해.':m.includes('PASSWORD_LENGTH')?'비밀번호는 6~72자로 만들어.':m.includes('INVALID_LOGIN')?'아이디 또는 비밀번호가 맞지 않아.':'로그인 서버에 연결하지 못했어.'}}
  async function syncProgress(showToast=true){const s=authSession();if(!s?.token)return;try{const remote=await rpc('science_drill_progress_get',{p_token:s.token});for(const row of remote.progress||[]){const local=JSON.parse(localStorage.getItem(`science-drill:${row.date}`)||'null'),r=row.data||{};if(!local||Number(r.at||0)>Number(local.at||0))localStorage.setItem(`science-drill:${row.date}`,JSON.stringify(r));else if(Number(local.at||0)>Number(r.at||0)){const set=sets.find(x=>!x.test&&x.date===row.date);if(set)await syncSave(set,local)}}for(const set of sets.filter(x=>!x.test)){const local=savedFor(set);if(local&&!((remote.progress||[]).some(x=>String(x.date)===set.date)))await syncSave(set,local)}if(showToast)toast('진도 동기화 완료');render()}catch(e){if(String(e.message).includes('INVALID_SESSION')){localStorage.removeItem(sessionKey);updateAccount();toast('로그인이 만료됐어. 다시 로그인해.')}else if(showToast)toast('동기화에 실패했어')}}async function logout(){const s=authSession();localStorage.removeItem(sessionKey);authDialog.close();updateAccount();render();if(s?.token)rpc('science_drill_logout',{p_token:s.token}).catch(()=>{});toast('로그아웃됨')}
  render();if(authSession()?.token)syncProgress(false);
  </script>
