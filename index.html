<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#eef3fb" />
<title>Science Step</title>
<style>
:root{color-scheme:light;--bg:#edf2fa;--panel:#eef3fb;--ink:#1e2837;--muted:#6e7a8d;--blue:#5c78ff;--blue2:#dfe6ff;--mint:#35b98f;--mint2:#dff7ef;--shadow:14px 14px 28px #cbd2df,-14px -14px 28px #fff;--shadow-sm:7px 7px 15px #cbd2df,-7px -7px 15px #fff;--inset:inset 5px 5px 10px #d4dae5,inset -5px -5px 10px #fff}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Pretendard,Inter,system-ui,-apple-system,"Noto Sans KR",sans-serif;letter-spacing:-.02em}button{font:inherit;color:inherit}.app{width:min(980px,calc(100% - 28px));margin:0 auto;padding:18px 0 90px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.logo{width:38px;height:38px;border-radius:14px;background:var(--panel);box-shadow:var(--shadow-sm);display:grid;place-items:center;font-weight:950;color:var(--blue)}.date{font-size:12px;color:var(--muted);font-weight:700}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-bottom:18px}.clay{background:var(--panel);border:1px solid rgba(255,255,255,.72);box-shadow:var(--shadow);border-radius:28px}.hero-main{padding:24px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.12em;color:#7b8799}.hero h1{margin:7px 0 10px;font-size:clamp(28px,5vw,46px);line-height:1.05;letter-spacing:-.055em}.hero p{margin:0;color:var(--muted);line-height:1.65;font-size:14px}.goal{padding:20px;display:grid;align-content:center}.goal strong{font-size:34px}.goal span{color:var(--muted);font-size:12px;font-weight:750}.progress{height:10px;border-radius:99px;background:var(--panel);box-shadow:var(--inset);overflow:hidden;margin-top:12px}.progress>i{display:block;height:100%;width:0;border-radius:99px;background:var(--blue);transition:.3s}.daily-entry{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:14px 0 18px;padding:16px 18px;text-decoration:none;color:var(--ink);transition:.18s}.daily-entry:hover{transform:translateY(-2px)}.daily-entry strong{display:block;font-size:17px}.daily-entry span{display:block;margin-top:4px;font-size:12px;color:var(--muted);line-height:1.45}.daily-entry b{flex:0 0 auto;padding:9px 12px;border-radius:13px;background:var(--blue);color:#fff;font-size:12px}.tabs{display:flex;gap:10px;margin:16px 0}.tab{border:0;border-radius:16px;background:var(--panel);box-shadow:var(--shadow-sm);padding:11px 15px;font-weight:850;cursor:pointer}.tab.active{box-shadow:var(--inset);color:var(--blue)}.track-head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin:22px 2px 12px}.track-head h2{margin:0;font-size:23px}.track-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.unit-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.unit{padding:18px;cursor:pointer;transition:.18s;position:relative;overflow:hidden}.unit:hover{transform:translateY(-2px)}.unit.locked{opacity:.58;cursor:not-allowed}.unit-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.unit-num{width:36px;height:36px;border-radius:13px;display:grid;place-items:center;font-weight:900;background:var(--blue2);color:var(--blue);box-shadow:var(--shadow-sm)}.chem .unit-num{background:var(--mint2);color:var(--mint)}.unit h3{margin:14px 0 5px;font-size:19px}.meta{font-size:12px;color:var(--muted)}.stars{display:flex;gap:4px;margin-top:14px;font-size:15px}.star{opacity:.22}.star.on{opacity:1}.badge{font-size:10px;font-weight:900;background:#fff8d9;color:#947016;border-radius:999px;padding:5px 8px}.study{display:none}.study.show{display:block}.study-shell{max-width:760px;margin:0 auto}.back{border:0;background:transparent;font-weight:850;color:var(--muted);padding:8px 0;cursor:pointer}.lesson-card{padding:24px;margin-top:10px}.lesson-kicker{font-size:11px;font-weight:900;color:var(--blue);letter-spacing:.08em}.lesson-card h2{font-size:28px;margin:8px 0 14px;letter-spacing:-.045em}.lesson-card p{font-size:16px;line-height:1.85;margin:0;color:#394559}.visual{margin:20px 0;padding:18px;border-radius:22px;background:var(--panel);box-shadow:var(--inset);min-height:128px;display:grid;place-items:center;text-align:center}.formula{font-size:clamp(20px,4vw,30px);font-weight:900;letter-spacing:-.03em}.compact-formula{font-size:18px}.split{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px}.split div{padding:18px 10px;border-radius:18px;background:#f8faff;font-weight:850}.trajectory{width:min(480px,100%);height:150px;position:relative}.trajectory:before{content:"";position:absolute;left:8%;right:8%;bottom:18%;height:95px;border-top:5px solid var(--blue);border-radius:50% 50% 0 0;transform:scaleY(.72)}.trajectory span{position:absolute;left:50%;top:8px;transform:translateX(-50%);font-weight:850;font-size:13px}.circle-v{width:130px;height:130px;border:5px solid #92a6ff;border-radius:50%;position:relative}.circle-v:after{content:"●";position:absolute;right:-9px;top:49px;color:var(--blue);font-size:24px}.circle-v span{position:absolute;width:230px;left:50%;top:50%;transform:translate(-50%,-50%);font-size:12px;font-weight:850}.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.chip{padding:12px 16px;border-radius:16px;background:#f8faff;box-shadow:var(--shadow-sm);font-weight:900}.check{margin-top:20px;padding-top:20px;border-top:1px solid #dce3ef}.check h3{font-size:16px;margin:0 0 12px}.choices{display:grid;gap:9px}.choice{border:0;background:var(--panel);box-shadow:var(--shadow-sm);border-radius:16px;padding:13px 14px;text-align:left;font-weight:760;cursor:pointer}.choice.selected{box-shadow:var(--inset);color:var(--blue)}.choice.good{background:#e1f7ef;color:#167858}.choice.bad{background:#ffe9ec;color:#a33b49}.choice:disabled{cursor:default}.feedback{display:none;margin-top:12px;border-radius:16px;padding:14px;line-height:1.6;font-size:13px}.feedback.show{display:block}.feedback.good{background:#e1f7ef;color:#176b50}.feedback.bad{background:#ffe9ec;color:#8e3441}.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;border:0;border-radius:17px;padding:14px 16px;font-weight:900;cursor:pointer;background:var(--panel);box-shadow:var(--shadow-sm)}.btn.primary{background:var(--blue);color:#fff;box-shadow:7px 7px 15px #c5ccdb,-4px -4px 11px #fff}.btn:disabled{opacity:.45;cursor:not-allowed}.celebrate{display:none;text-align:center;padding:28px}.celebrate.show{display:block}.celebrate .big{font-size:48px}.celebrate h2{font-size:28px;margin:8px}.xp{display:inline-block;margin-top:8px;padding:8px 12px;border-radius:999px;background:#fff8d9;color:#86640f;font-weight:900}.home.hide{display:none}.footer-note{text-align:center;color:var(--muted);font-size:11px;margin-top:26px;line-height:1.6}
@media(max-width:700px){.hero{grid-template-columns:1fr}.unit-list{grid-template-columns:1fr}.goal{grid-template-columns:auto 1fr;align-items:center;gap:14px}.goal .progress{margin:0}.hero-main,.lesson-card{padding:19px}.clay{border-radius:23px}.lesson-card h2{font-size:24px}.split{grid-template-columns:1fr}.app{width:min(100% - 20px,980px)}.daily-entry{padding:14px}.daily-entry b{padding:8px 10px}}
@media(max-height:430px) and (orientation:landscape){.hero{grid-template-columns:1fr 1fr}.hero-main{padding:15px}.hero h1{font-size:27px}.hero p{font-size:12px}.unit-list{grid-template-columns:repeat(2,1fr)}.lesson-card{padding:16px}.visual{min-height:95px;margin:12px 0}.lesson-card p{font-size:14px;line-height:1.6}}
</style>
</head>
<body>
<main class="app">
  <div class="top"><div class="brand"><div class="logo">S</div><span>Science Step</span></div><div class="date">중간고사 · 9월 28일</div></div>
  <section class="home" id="home">
    <div class="hero">
      <div class="clay hero-main"><div class="eyebrow">JEONGDONG · GRADE 2</div><h1>한 번에 하나만<br>완전히 이해하기</h1><p>설명 하나 → 그림 하나 → 확인 문제 하나. 쉬는 시간에도 부담 없이 이어서 공부하도록 만든 학습 모드야.</p></div>
      <div class="clay goal"><div><span>전체 학습 진도</span><br><strong id="pct">0%</strong></div><div class="progress"><i id="bar"></i></div></div>
    </div>
    <a class="clay daily-entry" href="drill.html"><div><strong>오늘 웹 문제 풀기</strong><span>표·실험자료·계산 문제를 풀고, 틀리면 보강 2문제를 모두 맞혀야 완료돼.</span></div><b>문제 시작 →</b></a>
    <div class="tabs"><button class="tab active" data-track="physics">물리</button><button class="tab" data-track="chemistry">화학</button></div>
    <div id="track"></div>
    <div class="footer-note">진도는 이 기기에 자동 저장돼. 맞혀야 다음 개념이 열리고, 틀리면 같은 개념 설명을 다시 보고 바로 재도전할 수 있어.</div>
  </section>
  <section class="study" id="study"><div class="study-shell"><button class="back" id="back">← 학습 목록</button><div id="lesson"></div></div></section>
</main>
<script src="learning-data.js"></script>
<script src="learning-app.js"></script>
</body>
</html>
